name: 构建 APK

on:
  push:
    branches:
      - main
      - 'claude/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_type:
        description: 构建变体
        type: choice
        default: debug
        options:
          - debug
          - release

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: 打包 ${{ inputs.build_type || 'debug' }} APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      # setup-gradle 默认校验 gradle-wrapper.jar 的校验和，并缓存依赖与构建缓存
      - name: 配置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 准备签名密钥（仅 release，且仓库配置了密钥时）
        id: signing
        if: ${{ inputs.build_type == 'release' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "仓库没有配置 KEYSTORE_BASE64，release 产物将是未签名的 APK。"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "path=$RUNNER_TEMP/signing/release.jks" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: 构建 APK
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
          SIGNING_AVAILABLE: ${{ steps.signing.outputs.available }}
          KEYSTORE_PATH: ${{ steps.signing.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "$BUILD_TYPE" = "release" ]; then
            if [ "$SIGNING_AVAILABLE" = "true" ]; then
              # 用注入属性签名，不必把 signingConfig 写进 build.gradle.kts
              ./gradlew --no-daemon assembleRelease \
                "-Pandroid.injected.signing.store.file=$KEYSTORE_PATH" \
                "-Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD" \
                "-Pandroid.injected.signing.key.alias=$KEY_ALIAS" \
                "-Pandroid.injected.signing.key.password=$KEY_PASSWORD"
            else
              ./gradlew --no-daemon assembleRelease
            fi
          else
            ./gradlew --no-daemon assembleDebug
          fi

      - name: 整理产物
        id: collect
        env:
          BUILD_TYPE: ${{ inputs.build_type || 'debug' }}
        run: |
          set -euo pipefail
          outdir="app/build/outputs/apk/$BUILD_TYPE"
          mkdir -p artifacts
          version=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
          short_sha=$(git rev-parse --short HEAD)
          for apk in "$outdir"/*.apk; do
            suffix=""
            case "$(basename "$apk")" in
              *unsigned*) suffix="-unsigned" ;;
            esac
            cp "$apk" "artifacts/youma-${version}-${BUILD_TYPE}${suffix}-${short_sha}.apk"
          done
          echo "name=youma-${version}-${BUILD_TYPE}-${short_sha}" >> "$GITHUB_OUTPUT"
          ls -lh artifacts
          {
            echo "### APK 产物"
            echo
            for apk in artifacts/*.apk; do
              echo "- \`$(basename "$apk")\`（$(du -h "$apk" | cut -f1)）"
            done
            if [ "$BUILD_TYPE" = "release" ] && [ "${{ steps.signing.outputs.available }}" != "true" ]; then
              echo
              echo "⚠️ 未配置签名密钥，产物是未签名 APK，不能直接安装。"
              echo "在仓库 Secrets 里加上 \`KEYSTORE_BASE64\`、\`KEYSTORE_PASSWORD\`、\`KEY_ALIAS\`、\`KEY_PASSWORD\` 后重跑即可拿到已签名包。"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.collect.outputs.name }}
          path: artifacts/*.apk
          if-no-files-found: error
          retention-days: 14
